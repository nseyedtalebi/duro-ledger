services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DURO_POSTGRES_DB:-duro}
      POSTGRES_USER: ${DURO_POSTGRES_USER:-duro}
      POSTGRES_PASSWORD: ${DURO_POSTGRES_PASSWORD:?set DURO_POSTGRES_PASSWORD}
    ports:
      - "${DURO_POSTGRES_BIND:-127.0.0.1}:${DURO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DURO_POSTGRES_DATA_DIR:-./.duro-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
